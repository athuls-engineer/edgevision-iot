vision:
  source: "synthetic" # Options: 'synthetic', 'webcam', 'rtsp://...', or 'path/to/video.mp4'
  device_index: 0
  frame_width: 640
  frame_height: 480
  target_fps: 30
  enable_enhancement: true
  enhancement_method: "clahe" # Options: 'clahe', 'global_he', 'gamma'
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]
  gamma_value: 1.2
  motion_detection:
    enabled: true
    min_contour_area: 500
    threshold_value: 25
    blur_kernel_size: 21

telemetry:
  enabled: true
  interval_seconds: 1.0
  mqtt:
    enabled: false
    broker: "broker.hivemq.com"
    port: 1883
    topic: "edgevision/telemetry/node_01"
    client_id: "edgevision_node_01"
  alerts:
    low_fps_threshold: 10.0
    low_light_threshold: 35.0

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
